services:
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: matching-postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: matching_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  resume-matching:
    build:
      context: ../interview-resume-matching-service
      dockerfile: Dockerfile
    container_name: interview-resume-matching
    env_file:
      - ../interview-resume-matching-service/.env
    environment:
      DATABASE_URL: postgresql://user:password@postgres-db:5432/matching_db
    ports:
      - "5001:5001"
    depends_on:
      - postgres-db
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview-prep-backend
    env_file:
      - ./.env
    environment:
      API_BASE_URL: http://backend:5000
      CORS_ORIGIN: http://localhost:3000
      RESUME_MATCHING_SERVICE_URL: http://resume-matching:5001
      RESUME_MATCHING_TIMEOUT_MS: "120000"
    ports:
      - "5000:5000"
    depends_on:
      - resume-matching
    restart: unless-stopped

  cv-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview-prep-cv-worker
    env_file:
      - ./.env
    environment:
      API_BASE_URL: http://backend:5000
      RESUME_MATCHING_SERVICE_URL: http://resume-matching:5001
      RESUME_MATCHING_TIMEOUT_MS: "120000"
    command: ["node", "dist/workers/cv-worker/cv.worker.js"]
    depends_on:
      - backend
      - resume-matching
    restart: unless-stopped

  jp-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview-prep-jp-worker
    env_file:
      - ./.env
    environment:
      API_BASE_URL: http://backend:5000
      RESUME_MATCHING_SERVICE_URL: http://resume-matching:5001
      RESUME_MATCHING_TIMEOUT_MS: "120000"
    command: ["node", "dist/workers/jp-worker/jp.worker.js"]
    depends_on:
      - backend
      - resume-matching
    restart: unless-stopped

  frontend:
    build:
      context: ../interview-prep-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
        NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-309332258875-63ekd74cfui5k3kb90na1r34i7e402o9.apps.googleusercontent.com}
    container_name: interview-prep-frontend
    env_file:
      - ../interview-prep-frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
